[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yichen_doc"
version = "2.0.0"
description = "Evidence-driven research content and DOCX/PPTX/XLSX/HTML production"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0"
]

[project.optional-dependencies]
test = ["python-pptx>=1.0.0"]

[project.scripts]
yichen_doc = "yichen_doc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yichen_doc = ["schema/*.json", "renderers/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
